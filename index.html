    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("sanjay-theme");
          var light = stored
            ? stored === "light"
            : !matchMedia("(prefers-color-scheme: dark)").matches;
          var list = document.documentElement.classList;
          list.toggle("light", light);
          list.toggle("dark", !light);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", light ? "#f7f7f2" : "#111315");
        } catch (e) {}
      })();
    </script>
    <style>
  html { background: #f7f7f2; }
  html.dark { background: #111315; }
